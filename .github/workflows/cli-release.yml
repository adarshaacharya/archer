name: CLI Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Lint Typecheck Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build

  build-release-assets:
    name: Build Release Asset (${{ matrix.asset }})
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: archer-darwin-arm64.tar.gz
            runner: macos-14
          - target: bun-darwin-x64
            asset: archer-darwin-x64.tar.gz
            runner: macos-15-intel
          - target: bun-linux-arm64
            asset: archer-linux-arm64.tar.gz
            runner: ubuntu-24.04-arm
          - target: bun-linux-x64
            asset: archer-linux-x64.tar.gz
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package binary
        run: bun run --filter @adarshaacharya/archer package:binary
        env:
          ARCHER_TARGET: ${{ matrix.target }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: apps/cli/release/${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
          generate_release_notes: true

  publish-npm:
    name: Publish npm Package
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --filter @adarshaacharya/archer build

      - name: Prepare npm publish directory
        run: |
          rm -rf .publish
          mkdir -p .publish
          cp -R dist .publish/dist
          cp README.md .publish/README.md
          cp ../../LICENSE .publish/LICENSE
          cat > .publish/package.json <<'JSON'
          {
            "name": "@adarshaacharya/archer",
            "version": "0.0.0",
            "type": "module",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/adarshaacharya/archer.git"
            },
            "bin": {
              "archer": "dist/index.js"
            },
            "files": [
              "dist"
            ],
            "license": "MIT",
            "publishConfig": {
              "access": "public",
              "registry": "https://registry.npmjs.org/"
            },
            "engines": {
              "node": ">=18"
            }
          }
          JSON
        working-directory: apps/cli

      - name: Sync publish version with tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version
        working-directory: apps/cli/.publish

      - name: Publish to npm
        run: npm publish --access public
        working-directory: apps/cli/.publish
